name: 'Pre-check on PR'
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: dev
    paths:
      - 'src/**'
      - 'lib/**'
      - 'test/**'
      
jobs:
  pre-release:
    name: 'Automatic pre-release build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pioarduino
        run: |
          pip install wheel
          pip install -U "pioarduino==6.2.0"

      - name: Run unit tests
        run: |
          platformio run -e native-test -t exec

      # a new seed on every run, the log shows it so a failure can be reproduced locally with FUZZ_SEED
      - name: Fuzz the command parser
        env:
          FUZZ_ITERATIONS: 200000
          FUZZ_SEED: ${{ github.run_number }}
        run: |
          platformio run -e native-fuzz -t exec
