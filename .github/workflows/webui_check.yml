name: 'WebUI check'
permissions:
  contents: read

# Lint, type check and the firmware build of the web UI, with its flash size in the job summary.
on:
  workflow_dispatch:
  pull_request:
    branches: dev
    paths:
      - 'interface/**'
      - '.github/workflows/webui_check.yml'
  push:
    branches: dev
    paths:
      - 'interface/**'
      - '.github/workflows/webui_check.yml'

jobs:
  webui:
    name: Lint, build and size
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: interface/package.json

      - name: Install Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('interface/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        env:
          CI: true
        run: pnpm install --frozen-lockfile

      # also generates the i18n types that lint and tsc need
      - name: Build webUI
        run: pnpm build-webUI

      - name: Lint
        run: pnpm exec eslint .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Size report
        run: pnpm --silent size-report >> "$GITHUB_STEP_SUMMARY"
